{% extends 'base.html' %}
{% block content %}
    <div style="max-width: 650px; margin: 0 auto;">
        <h2>Search</h2>
        <form method="POST" action="/search">
            {% csrf_token %}
            <input type="text" name="query" autofocus required>
            <button type="submit">Search</button>
        </form>
    </div>
{% endblock %}
